name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Se actualiza solo cada 24 horas
  workflow_dispatch:    # Botón para ejecutarlo manualmente desde la pestaña Actions

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Neon Cyberpunk Pac-Man SVGs (Dark & Light)
        run: |
          python3 scripts/generate_pacman.py
          cp dist/pacman-contribution-graph-dark.svg assets/pacman-dark.svg
          cp dist/pacman-contribution-graph.svg assets/pacman-light.svg

      - name: Commit updated Arcade SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman-dark.svg assets/pacman-light.svg
          git diff --staged --quiet || git commit -m "Chore: actualizar tablero Pac-Man Contribution Arcade"
          git push
